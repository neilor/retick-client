name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: testes e tipos (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # As linhas de LTS vivas. A suite roda direto do TypeScript pela
        # remocao de tipos do proprio Node, e isso pede 22.18 ou mais.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  instalacao:
    name: instala e executa (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Aqui o alvo e o `engines` do pacote, que comeca em 18.17 por causa
        # do `fetch`. O que roda e o JavaScript compilado, entao a versao
        # minima precisa ser exercitada de verdade e nao so prometida.
        node: ['18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: ./scripts/provar-instalacao-avulsa.sh

  empacotamento:
    name: o tarball nao leva o que nao deve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm install --no-audit --no-fund
      - run: ./scripts/varrer-o-pacote.sh
