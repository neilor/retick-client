name: diagnostico-token

# Temporario. Responde uma pergunta so: o que o NPM_TOKEN deste repositorio
# alcanca? Nao publica nada e nao imprime o token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: quem e o token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: pacotes que o token alcanca
        run: npm access list packages || echo "(o comando falhou; ver codigo acima)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: pacotes no escopo @retick
        run: npm access list packages @retick || echo "(falhou)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: a org retick enxerga o token
        run: npm org ls retick || echo "(falhou)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
